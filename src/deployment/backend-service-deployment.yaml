apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.36.0 (HEAD)
  labels:
    io.kompose.service: backend-service
  name: backend-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: backend-service
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.36.0 (HEAD)
      labels:
        io.kompose.service: backend-service
    spec:
      containers:
        - image: backend-service
          name: backend-service
          ports:
            - containerPort: 5128
              protocol: TCP
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
