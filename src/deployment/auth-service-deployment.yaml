apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.controller.expose.port: "true"
    kompose.init.containers.command: echo Initializing auth service
    kompose.init.containers.image: docker.io/library/deployment-auth-service:latest
    kompose.service.healthcheck.readiness.start_period: 30s
    kompose.service.healthcheck.readiness.test: CMD curl -f http://localhost:8010/health
    kompose.service.readinessProbe.httpGet.port: "8010"
    kompose.version: 1.36.0 (HEAD)
  labels:
    io.kompose.service: auth-service
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: auth-service
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.controller.expose.port: "true"
        kompose.init.containers.command: echo Initializing auth service
        kompose.init.containers.image: docker.io/library/deployment-auth-service:latest
        kompose.service.healthcheck.readiness.start_period: 30s
        kompose.service.healthcheck.readiness.test: CMD curl -f http://localhost:8010/health
        kompose.service.readinessProbe.httpGet.port: "8010"
        kompose.version: 1.36.0 (HEAD)
      labels:
        io.kompose.service: auth-service
    spec:
      containers:
        - image: tip_of_the_spear:latest
          name: auth-service
          ports:
            - containerPort: 8010
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - curl
                - -f
                - http://localhost:8010/health
            initialDelaySeconds: 30
      initContainers:
        - command:
            - echo Initializing auth service
          image: docker.io/library/deployment-auth-service:latest
          name: init-service
      restartPolicy: Always
