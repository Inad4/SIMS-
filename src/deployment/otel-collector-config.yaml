receivers:
  otlp:
    protocols:
      grpc: {}
      http: {}

  prometheus:
    config:
      scrape_configs:
        - job_name: microservices
          static_configs:
            - targets:
                - auth-service:8010
                - api-gateway-service:8009
                - backend-service:8080
                - frontend:6000

  hostmetrics:
    scrapers:
      cpu: {}
      memory: {}
      filesystem: {}
      network: {}

processors:
  batch: {}

exporters:
  otlp:
    endpoint: telemetry:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [prometheus, otlp, hostmetrics]
      processors: [batch]
      exporters: [otlp]
