apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.controller.expose.port: "true"
    kompose.init.containers.command: echo Initializing LGTM telemetry stack
    kompose.version: 1.36.0 (HEAD)
  labels:
    io.kompose.service: telemetry
  name: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: telemetry
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.controller.expose.port: "true"
        kompose.init.containers.command: echo Initializing LGTM telemetry stack
        kompose.version: 1.36.0 (HEAD)
      labels:
        io.kompose.service: telemetry
    spec:
      containers:
        - env:
            - name: GF_SERVER_ROOT_URL
              value: http://localhost:8009/api/v1/telemetry/
          image: grafana/otel-lgtm
          name: telemetry
          ports:
            - containerPort: 3000
              protocol: TCP
            - containerPort: 4317
              protocol: TCP
            - containerPort: 4318
              protocol: TCP
          volumeMounts:
            - mountPath: /data
              name: lgtm-data
      restartPolicy: Always
      volumes:
        - name: lgtm-data
          persistentVolumeClaim:
            claimName: lgtm-data
