services:
  auth-postgres-db:
    image: postgres:16
    container_name: auth-postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-aibest}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    restart: unless-stopped

  api-gateway-redis:
    image: redis:7-alpine
    container_name: api-gateway-redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    volumes:
      - redis_data:/data
    restart: unless-stopped

  auth-service:
    build:
      context: ../tip_of_the_spear/src/
      dockerfile: ./auth_service/Dockerfile
    ports:
      - "8010:8010"
    depends_on:
      - auth-postgres-db
    networks:
      - app-network
    restart: unless-stopped

  api-gateway-service:
    build:
      context: ../tip_of_the_spear/src/
      dockerfile: ./api_gateway_service/Dockerfile
    ports:
      - "8009:8009"
    depends_on:
      - auth-service
      - api-gateway-redis
    networks:
      - app-network
    restart: unless-stopped

  backend-service:
    build:
      context: ../
      dockerfile: ./SIMS_BACKEND/Dockerfile
    ports:
      - "5128:5128"
      - "8080:8080"
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge

