apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.controller.expose.port: "true"
    kompose.init.containers.command: echo Initializing LGTM telemetry stack
    kompose.version: 1.36.0 (HEAD)
  labels:
    io.kompose.service: telemetry
  name: telemetry
spec:
  ports:
    - name: "3000"
      port: 3000
      targetPort: 3000
    - name: "4317"
      port: 4317
      targetPort: 4317
    - name: "4318"
      port: 4318
      targetPort: 4318
  selector:
    io.kompose.service: telemetry
