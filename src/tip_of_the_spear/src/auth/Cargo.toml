[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
jsonwebtoken = "9.3.1"
serde = { version = "1.0.217", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
sqlx = { version = "0.8.3", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "macros",
] }
chrono = { version = "0.4.39", features = ["serde"] }
lazy_static = "1.5.0"
openssl = { version = "0.10.73", features = ["vendored"] }
pem = "3.0.5"
rand = "0.9.1"
tokio = { version = "1.43.0", features = ["full"] }
actix-cors = "0.7.0"
actix-web = { version = "4.5.1" }
argon2 = "0.5.3"
log = "0.4.27"
crypto = { path = "../crypto" }
db = { path = "../db" }
error = { path = "../error" }
config_yaml = { path = "../config_yaml" }
api_gateway = { path = "../api_gateway" }
# uuid = {version = "1.17.0", features = ["v4", "serde"]}
# rand_core = "0.6.0"
