[package]
name = "api_gateway_service"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12.22", features = [
    "json",
    "gzip",
    "stream",
    "cookies",
    "rustls-tls",
] }
tokio = { version = "1.46.1", features = ["full"] }
utoipa = { version = "5.2.0", features = ["chrono"] }
utoipa-swagger-ui = { version = "9.0.0", features = ["actix-web", "vendored"] }
actix = "0.13.5"
serde = "1.0.217"
serde_json = "1.0.140"
futures-util = "0.3.31"
actix-cors = "0.7.0"
actix-web = { version = "4.5.1" }
log = "0.4.27"
env_logger = "0.11.8"
env = { path = "../env" }
config_yaml = { path = "../config_yaml" }
api_gateway = { path = "../api_gateway" }
error = { path = "../error" }
auth = { path = "../auth" }
caching = { path = "../caching" }


opentelemetry = "0.30"
opentelemetry-otlp = { version = "0.30", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio-current-thread"] }
opentelemetry-semantic-conventions = "0.30"
tracing = "0.1"
tracing-bunyan-formatter = "0.3"
tracing-opentelemetry = "0.31"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
tracing-actix-web = { version = "0.7.19", features = ["opentelemetry_0_30"] }
# pyroscope = "0.5.8"
# pyroscope_pprofrs = "0.2.10"
