full_public_pem_url: http://auth-service:8010/public_pem
full_redis_url: "redis://api-gateway-redis/"
versions:
  - version: v1
    routes:
      - path: /auth
        strict_mode: true
        service_addresses:
          - auth-service:8010
        auth:
          full_auth_lockdown: false
          authorized_roles:
            - admin
            - user
        endpoints:
          - endpoint_path: /login
            auth_required: false
            authorized_roles:
              - admin
              - user
            cached: false
          - endpoint_path: /api-docs/*
            auth_required: false
            authorized_roles:
              - admin
              - user
            cached: false
          - endpoint_path: /signup
            auth_required: false
            authorized_roles:
              - admin
              - user
            cached: false
          - endpoint_path: /account/me
            auth_required: true
            authorized_roles:
              - admin
              - user
            cached: false
          - endpoint_path: /refresh_session
            auth_required: false
            authorized_roles:
              - admin
              - user
            cached: false
          - endpoint_path: /public_pem
            auth_required: false
            authorized_roles:
              - admin
              - user
            cached: true
            expiration_time_seconds: 900
      - path: /school
        strict_mode: false
        service_addresses:
          - backend-service:5128
        auth:
          full_auth_lockdown: false
          authorized_roles:
            - user
            - admin
        endpoints:
          - endpoint_path: /nz
            auth_required: false
            authorized_roles:
              - admin
              - user
            cached: false
      - path: /telemetry
        strict_mode: false
        service_addresses:
          - telemetry:3000
        auth:
          full_auth_lockdown: false
          authorized_roles:
            - user
            - admin
        endpoints:
          - endpoint_path: /nz
            auth_required: false
            authorized_roles:
              - admin
              - user
            cached: false
      - path: /dashboard
        strict_mode: false
        is_root_path: true
        service_addresses:
          - frontend:6000
        auth:
          full_auth_lockdown: false
          authorized_roles:
            - user
            - admin
        endpoints:
          - endpoint_path: /nz
            auth_required: false
            authorized_roles:
              - admin
              - user
            cached: false
