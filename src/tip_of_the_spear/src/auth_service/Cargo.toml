[package]
name = "auth_service"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-cors = "0.7.0"
actix-web = { version = "4.5.1" }
argon2 = "0.5.3"
env_logger = "0.11.6"
rand = "0.8.5"
serde = "1.0.217"
chrono = { version = "0.4.39", features = ["serde"] }
tokio = { version = "1.43.0", features = ["full"] }
utoipa = { version = "5.2.0", features = ["chrono"] }
utoipa-swagger-ui = { version = "9.0.0", features = ["actix-web", "vendored"] }
infer = "0.19.0"
actix = "0.13.5"
serde_json = "1.0.140"
lazy_static = "1.5.0"
futures-util = "0.3.31"
sqlx = { version = "0.8.3", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "macros",
] }
log = "0.4.27"
db = { path = "../db" }
env = { path = "../env" }
auth = { path = "../auth" }
error = { path = "../error" }
utils = { path = "../utils" }
