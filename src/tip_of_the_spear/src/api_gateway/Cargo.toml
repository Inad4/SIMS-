[package]
name = "api_gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
config_yaml = { path = "../config_yaml" }
error = { path = "../error" }
log = "0.4.27"
chrono = { version = "0.4.39", features = ["serde"] }
reqwest = { version = "0.12.22", features = [
    "json",
    "gzip",
    "stream",
    "cookies",
    "rustls-tls",
] }
tokio = { version = "1.43.0", features = ["full"] }
actix = "0.13.5"
serde = "1.0.217"
serde_json = "1.0.140"
futures-util = "0.3.31"
actix-cors = "0.7.0"
actix-web = { version = "4.5.1" }
http = "1.3.1"
