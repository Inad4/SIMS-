[package]
name = "caching"
version = "0.1.0"
edition = "2024"

[dependencies]
redis = { version = "0.32.4", features = ["tokio-rustls-comp", "r2d2", "json"] }
tokio = { version = "1.0", features = ["full"] }
error = { path = "../error" }
env = { path = "../env" }
config_yaml = { path = "../config_yaml" }
auth = { path = "../auth" }
api_gateway = { path = "../api_gateway" }
r2d2 = "0.8.10"
log = "0.4.27"
reqwest = { version = "0.12.22", features = [
    "json",
    "gzip",
    "stream",
    "cookies",
    "rustls-tls",
] }
serde = { version = "1.0.217", features = ["derive"] }
chrono = { version = "0.4.39", features = ["serde"] }
lazy_static = "1.5.0"
actix-cors = "0.7.0"
actix-web = { version = "4.5.1" }
actix = "0.13.5"
serde_json = "1.0.141"
rand = "0.9.1"
