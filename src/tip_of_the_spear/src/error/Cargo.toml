[package]
name = "error"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.0"
actix-web = { version = "4.5.1" }
argon2 = "0.5.3"
serde = "1.0.217"
chrono = { version = "0.4.39", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0.140"
r2d2 = "0.8.10"
redis = { version = "0.32.4", features = ["tokio-rustls-comp", "r2d2"] }
openssl = { version = "0.10.73" }
sqlx = { version = "0.8.3", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "macros",
] }
jsonwebtoken = "9.3.1"
